<div class="dialog-backdrop" *ngIf="open" (click)="cancelled.emit()">
  <section class="dialog-card" role="dialog" aria-modal="true" [attr.aria-label]="title" (click)="$event.stopPropagation()">
    <ng-container *ngIf="!customContent; else projectedContent"><span class="dialog-icon">?</span><h2>{{ title }}</h2><p>{{ message }}</p><div class="dialog-actions"><button type="button" class="cancel" (click)="cancelled.emit()">Cancel</button><button type="button" (click)="confirmed.emit()">{{ confirmLabel }}</button></div></ng-container>
    <ng-template #projectedContent><ng-content /></ng-template>
  </section>
</div>
