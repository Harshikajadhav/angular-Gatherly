<article class="event-card">
  <div class="event-image">
    <img [src]="event.image_url || '/assets/images/services/community.svg'" [alt]="event.title" />
  </div>
  <div class="event-body">
    <div class="event-meta">
      <span>{{ event.date | date: 'MMM d, y' }}</span>
      <span>{{ event.start_time }} - {{ event.end_time }}</span>
    </div>
    <h3>{{ event.title }}</h3>
    <p class="description">{{ event.description }}</p>
    <div class="event-location">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>
      {{ event.location }}
    </div>
    <div class="organization">
      <img [src]="event.organization.profile_pic || '/assets/images/logo/gatherly-mark.svg'" [alt]="event.organization.organization_name" />
      <div>
        <strong>{{ event.organization.organization_name }}</strong>
        <span *ngIf="event.organization.verification_status === 'VERIFIED'" class="verified">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.2 16.2-4-4L3.8 13.6l5.4 5.4 11-11-1.4-1.4-9.6 9.6Z"/></svg>
          Verified organization
        </span>
      </div>
    </div>
    <button type="button" (click)="openDetails()">View Event Details</button>
  </div>
</article>
