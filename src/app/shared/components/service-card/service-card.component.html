<article class="service-card">
  <div class="service-image">
    <img [src]="service.image_url || '/assets/images/services/community.svg'" [alt]="service.service_name"/>
  </div>
  <div class="service-body">
    <div class="service-meta">
      <span>{{ service.category }}</span>
      <span class="location">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>
        {{ service.location }}
      </span>
    </div>
    <h3>{{ service.service_name }}</h3>
    <p class="description">{{ service.description }}</p>
    <div class="organization">
      <img [src]="service.organization.profile_pic || '/assets/images/logo/gatherly-mark.svg'" [alt]="service.organization.organization_name"/>
      <div>
        <strong>{{ service.organization.organization_name }}</strong>
        <span *ngIf="service.organization.verification_status === 'VERIFIED'" class="verified">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.2 16.2-4-4L3.8 13.6l5.4 5.4 11-11-1.4-1.4-9.6 9.6Z"/></svg>
          Verified
        </span>
      </div>
    </div>
    <button type="button" (click)="openDetails()">View Details</button>
  </div>
</article>
