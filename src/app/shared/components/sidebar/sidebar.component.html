<div class="sidebar-scrim" *ngIf="open" (click)="close.emit()" aria-hidden="true"></div>
<aside class="dashboard-sidebar" [class.open]="open" aria-label="Dashboard navigation">
  <div class="sidebar-brand">
    <a [routerLink]="homeRoute" (click)="close.emit()" aria-label="Gatherly dashboard">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 44 44"><path d="M22 3.5a18.5 18.5 0 1 0 18.5 18.5H22V14.2h9.2A9.8 9.8 0 1 1 22 12.2V3.5Z"/><circle cx="22" cy="22" r="4.6"/></svg>
      </span>
      <span>Gatherly</span>
    </a>
    <span class="portal-label">{{ roleLabel }}</span>
  </div>

  <nav class="sidebar-nav">
    <a *ngFor="let item of items" [routerLink]="item.route" routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.route.endsWith('/dashboard') }" (click)="close.emit()">
      <span class="nav-icon" [ngSwitch]="item.icon">
        <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3Zm10 0h8v5h-8V3ZM3 13h8v8H3v-8Zm10-3h8v11h-8V10Z"/></svg>
        <svg *ngSwitchCase="'services'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 1 5 5v2h2a2 2 0 0 1 2 2v9H3v-9a2 2 0 0 1 2-2h2V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v2h6V7a3 3 0 0 0-3-3Zm-5 9v5h10v-5H7Z"/></svg>
        <svg *ngSwitchCase="'events'" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v3h10V2h2v3h2a2 2 0 0 1 2 2v13H1V7a2 2 0 0 1 2-2h2V2h2Zm14 8H3v8h18v-8Z"/></svg>
        <svg *ngSwitchCase="'organization'" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5l8-3 8 3v16h-5v-6h-6v6H4Zm5-10h6V9H9v2Zm0-4h6V5H9v2Z"/></svg>
        <svg *ngSwitchCase="'verification'" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.2 16.2-4-4L3.8 13.6l5.4 5.4 11-11-1.4-1.4-9.6 9.6ZM12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"/></svg>
        <svg *ngSwitchCase="'reports'" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16v18H4V3Zm3 4v2h10V7H7Zm0 4v2h10v-2H7Zm0 4v2h6v-2H7Z"/></svg>
        <svg *ngSwitchCase="'detail'" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16v18H4V3Zm3 4v2h10V7H7Zm0 4v2h10v-2H7Zm0 4v2h6v-2H7Z"/></svg>
        <svg *ngSwitchCase="'calendar'" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v3h10V2h2v3h2a2 2 0 0 1 2 2v13H1V7a2 2 0 0 1 2-2h2V2h2Zm14 8H3v8h18v-8Zm-9 2v2H7v-2h5Zm5 0v2h-3v-2h3Z"/></svg>
        <svg *ngSwitchCase="'profile'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 12c5 0 9 2.2 9 5v3H3v-3c0-2.8 4-5 9-5Z"/></svg>
        <svg *ngSwitchDefault viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 14 4l2.5-.2.9 2.4 2.1 1.4-.9 2.4.9 2.4-2.1 1.4-.9 2.4L14 16l-2 1.5L10 16l-2.5.2-.9-2.4-2.1-1.4.9-2.4-.9-2.4 2.1-1.4.9-2.4L10 4l2-1.5ZM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
      </span>
      <span>{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-bottom">
    <div class="sidebar-user">
      <span class="avatar">{{ userName.charAt(0) }}</span>
      <span><strong>{{ userName }}</strong><small>{{ roleLabel.replace(' Portal', '') }}</small></span>
    </div>
    <button type="button" class="logout-button" (click)="logout()">
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3H4v18h6v-2H6V5h4V3Zm5.6 4.6L14.2 9l2 2H9v2h7.2l-2 2 1.4 1.4L20 12l-4.4-4.4Z"/></svg></span>
      Logout
    </button>
  </div>
</aside>
