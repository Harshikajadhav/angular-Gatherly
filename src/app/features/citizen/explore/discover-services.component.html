<app-header *ngIf="!isCitizenPortal" />

<main class="discover-page">
  <section class="hero">
    <div class="hero-copy">
      <p class="eyebrow">COMMUNITY SERVICES</p>
      <h1>Discover Services</h1>
      <p>Find trusted organizations and services that make a difference in your community.</p>
    </div>
    <div class="search-box" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 4.1 11.55L19.2 20l1.5-1.5-4.6-4.6A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></svg>
      <input [(ngModel)]="searchText" type="search" placeholder="Search services, organizations, or keywords..." aria-label="Search services"/>
      <span class="search-label">Search</span>
    </div>
  </section>

  <section class="categories" aria-labelledby="categories-heading">
    <div class="section-heading">
      <div>
        <p class="eyebrow">BROWSE</p>
        <h2 id="categories-heading">Explore Categories</h2>
      </div>
    </div>
    <div class="category-grid">
      <button type="button" class="category-card" *ngFor="let item of categories"
        (click)="openCategory(item)" [attr.aria-label]="'Explore ' + item.name + ' events'">
        <span class="category-icon" [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'ngo'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-2-2.1-8-6.8-8-11.5A5.5 5.5 0 0 1 14.2 7.1 5.5 5.5 0 0 1 20 9.5c0 4.7-6 9.4-8 11.5ZM12 9.2c-1.3-1.8-3.8-1.8-5 0-1.2 1.7-.4 4.1 1.4 5.9.9.9 2 1.8 3.6 3.1 1.6-1.3 2.7-2.2 3.6-3.1 1.8-1.8 2.6-4.2 1.4-5.9-1.2-1.8-3.7-1.8-5 0Z"/><path d="M2.5 17.5h4l1.8-3 2.3 5 2-3h8.9v2h-7.7l-3.2 4.8-2.3-5-1 1.2H2.5v-2Z"/></svg>
          <svg *ngSwitchCase="'health'" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4v6h6v4h-6v6h-4v-6H4v-4h6V2Zm-7 15h4l2-4 3 7 2.5-5H22v2h-6l-3.5 7L9.5 17H3v-2Z"/></svg>
          <svg *ngSwitchCase="'learning'" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 10 5-10 5-10-5 10-5Zm-6 7.2 6 3 6-3V15c-3.4 2.2-8.6 2.2-12 0v-4.8ZM4 13v5c2.8 2 13.2 2 16 0v-5l-2 1v3.2c-3.4 1.2-8.6 1.2-12 0V14l-2-1Z"/></svg>
          <svg *ngSwitchCase="'events'" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v3h10V2h2v3h2a2 2 0 0 1 2 2v13H1V7a2 2 0 0 1 2-2h2V2h2Zm14 8H3v10h18V10Zm-12 2v2H7v-2h2Zm4 0v2h-2v-2h2Zm4 0v2h-2v-2h2ZM9 16v2H7v-2h2Zm4 0v2h-2v-2h2Zm4 0v2h-2v-2h2Z"/></svg>
        </span>
        <span class="category-name">{{ item.name }}</span>
        <span class="category-description">{{ item.description }}</span>
      </button>
    </div>
  </section>
</main>

<app-footer *ngIf="!isCitizenPortal" />
