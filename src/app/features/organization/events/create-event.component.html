<section class="create-event-page">
  <div class="page-intro"><p class="eyebrow">EVENTS</p><h2>Create Event</h2><p>Create a new opportunity for citizens to participate in your community work.</p></div>
  <p class="message" *ngIf="message" role="status">{{ message }}</p>
  <form class="event-form" [formGroup]="eventForm" (ngSubmit)="submit()" novalidate>
    <div class="form-main"><h3>Event information</h3><div class="form-grid"><label class="full"><span>Event Title</span><input formControlName="title" placeholder="Enter an event title" /><small *ngIf="eventForm.controls.title.touched && eventForm.controls.title.invalid">Event title is required.</small></label><label class="full"><span>Description</span><textarea rows="4" formControlName="description" placeholder="Describe the event"></textarea><small *ngIf="eventForm.controls.description.touched && eventForm.controls.description.invalid">A description is required.</small></label><label><span>Category</span><select formControlName="category"><option value="">Select category</option><option *ngFor="let category of categories" [value]="category">{{ category }}</option></select></label><label><span>Event Date</span><input type="date" formControlName="date" /></label><label><span>Start Time</span><input type="time" formControlName="start_time" /></label><label><span>End Time</span><input type="time" formControlName="end_time" /></label><label class="full"><span>Venue and Location</span><input formControlName="location" placeholder="Enter the event venue and address" /></label><label class="full"><span>Registration Information</span><textarea rows="2" formControlName="registration_information" placeholder="Optional registration instructions"></textarea></label></div></div>
    <aside class="cover-card"><h3>Cover Image</h3><img [src]="coverPreview" alt="Event cover preview" /><label class="upload-button">Choose image<input type="file" accept="image/*" (change)="onCoverSelected($event)" /></label><p>Images are kept in this mock session until the API is connected.</p></aside>
    <div class="form-actions"><a [routerLink]="returnPath">Cancel</a><button type="submit">Publish Event</button></div>
  </form>
</section>
